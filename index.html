<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taal: choreography studio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B4236B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taal">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF4F0; --surface:#FFFFFF; --sunk:#F3E8E5; --ink:#2A1730; --muted:#75617A; --line:#E8DADF;
  --accent:#B4236B; --accent-ink:#FFFFFF; --accent-soft:#F8E1EC;
  --gold:#B97A06; --gold-soft:#FBEFD3; --done:#2E7A47; --done-soft:#E1F1E6; --warn:#C2410C; --warn-soft:#FCE6DA;
  --wa:#1E8A4B; --scrim:rgba(30,10,30,.45); --bar:rgba(251,244,240,.88);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1120; --surface:#251829; --sunk:#30203A; --ink:#F7ECF3; --muted:#BCA7BE; --line:#3B2944;
    --accent:#F0679F; --accent-ink:#1B1120; --accent-soft:#45203A;
    --gold:#F2B940; --gold-soft:#3F3018; --done:#6CC48A; --done-soft:#1E3A29; --warn:#FB8F5A; --warn-soft:#442719;
    --wa:#2FBF68; --scrim:rgba(0,0,0,.6); --bar:rgba(27,17,32,.88);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1120; --surface:#251829; --sunk:#30203A; --ink:#F7ECF3; --muted:#BCA7BE; --line:#3B2944;
  --accent:#F0679F; --accent-ink:#1B1120; --accent-soft:#45203A;
  --gold:#F2B940; --gold-soft:#3F3018; --done:#6CC48A; --done-soft:#1E3A29; --warn:#FB8F5A; --warn-soft:#442719;
  --wa:#2FBF68; --scrim:rgba(0,0,0,.6); --bar:rgba(27,17,32,.88);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{max-width:680px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:600}
.display{font-family:"Rozha One",Georgia,serif;font-weight:400}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

/* page heads */
.pagehead{padding:22px 0 6px}
.pagehead h1{font-size:2.05rem;line-height:1.08}
.pagehead p{margin:.3rem 0 0;color:var(--muted)}
.sec{margin-top:28px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.sec-head h2{font-size:1.08rem}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:.95rem}

/* sticky bars */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -16px;padding:8px 10px;display:flex;align-items:center;gap:6px;min-height:52px}
.topbar .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.topbar.scrolled .t{opacity:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;background:none;border:0;border-radius:12px;min-width:40px;height:40px;padding:0 8px;color:var(--ink)}
.iconbtn:active{background:var(--sunk)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.segbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:7;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -16px;padding:6px 16px 10px}

/* chips & badges */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;white-space:nowrap;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--sunk);white-space:nowrap;vertical-align:middle}
.b-enquiry{background:var(--gold-soft);color:var(--gold)}
.b-booked{background:var(--accent-soft);color:var(--accent)}
.b-done{background:var(--done-soft);color:var(--done)}
.b-cancelled{color:var(--muted)}
.b-soon{background:var(--warn-soft);color:var(--warn)}
.b-due{background:var(--warn-soft);color:var(--warn)}

/* cards */
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:10px}
button.card:active{transform:scale(.995)}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card .name{font-size:1.4rem;line-height:1.12}
.card .meta{color:var(--muted);font-size:.9rem;margin-top:2px}
.card .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:12px}
.eq{display:flex;align-items:flex-end;gap:3px;height:28px;flex:1;min-width:0}
.eq i{display:block;flex:1;max-width:9px;height:calc(var(--h) * 100%);min-height:3px;border-radius:2px;background:var(--accent)}
.eq i.zero{background:var(--line)}
.eq i.full{background:var(--done)}
.count{font-size:.88rem;color:var(--muted);white-space:nowrap}
.count b{color:var(--ink);font-size:1.1rem}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-size:1.2rem;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.kpi.big{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.big b{font-size:1.75rem}
.kpi.big span{color:inherit;opacity:.75}
.kpi.big .btn{background:var(--bg);color:var(--ink);opacity:1}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px 9px;text-align:center}
.stage b{display:block;font-size:1.35rem;line-height:1.1}
.stage span{display:block;font-size:.7rem;color:var(--muted);margin-top:2px;line-height:1.15}
.stage.zero b{color:var(--muted);opacity:.6}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow small{display:block;color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.timecol{width:58px;flex:none;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.timecol small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.dayhead{font-weight:700;font-size:.92rem;margin:20px 0 8px;display:flex;gap:8px;align-items:baseline}
.dayhead span{color:var(--muted);font-weight:500}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:10px 15px;font-weight:600;background:var(--sunk);text-decoration:none;color:var(--ink);font-size:.95rem;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn-soft)}
.btn.sm{padding:7px 11px;font-size:.84rem;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.fill>*{flex:1}
.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(86px + env(safe-area-inset-bottom,0px));border:0;border-radius:18px;padding:14px 20px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 10px 26px rgba(180,35,107,.32);z-index:6;display:flex;gap:6px;align-items:center}
.fab[hidden]{display:none}

/* client hero */
.hero{padding:6px 0 14px}
.hero h1{font-size:2.3rem;line-height:1.04}
.hero .meta{color:var(--muted);margin-top:6px}
.hero .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero .btns{margin-top:14px}

/* performances & songs */
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.stat{font-size:.8rem;padding:4px 9px;border-radius:8px;background:var(--sunk)}
.stat b{font-weight:700}
.perf{margin-top:24px}
.perf-head{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.order{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.perf-head h2{font-size:1.12rem;flex:1;min-width:0}
.perf-head .iconbtn{min-width:34px;height:34px;padding:0 4px}
.perf-meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.song{padding:12px 0;border-bottom:1px solid var(--line)}
.song-main{display:flex;gap:10px;align-items:flex-start;width:100%;background:none;border:0;padding:0;text-align:left}
.song-main .t{font-weight:600;flex:1;min-width:0}
.song-main .t small{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
.song-main .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem;padding-top:1px}
.nx{display:block;font-size:.78rem;margin-top:3px;font-weight:700}
.nx.s0{color:var(--gold)} .nx.s1,.nx.s2{color:var(--accent)} .nx.s3,.nx.s4{color:var(--warn)} .nx.s5{color:var(--done)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:9px}
.step{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 2px;font-size:.74rem;font-weight:700;color:var(--muted)}
.step.on{background:var(--done);border-color:var(--done);color:var(--bg)}
.songlinks{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.add-row{margin-top:10px;background:none;border:1px dashed var(--line);border-radius:12px;width:100%;padding:11px;color:var(--muted);font-weight:600}
.note{white-space:pre-wrap;color:var(--muted);font-size:.9rem;margin-top:8px}

/* money */
.moneybox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.moneybox .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left}
.moneybox .three b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.moneybox .three span{font-size:.78rem;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:14px 0 4px}
.meter i{display:block;height:100%;background:var(--done);border-radius:99px}

/* info rows */
.info .li{cursor:default}
.info dt{font-size:.8rem;color:var(--muted)}
.info dd{margin:0;font-weight:500;word-break:break-word}

/* empty */
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty p{max-width:32ch;margin:0 auto 16px}
.empty .eq{justify-content:center;height:46px;margin:0 auto 16px;max-width:120px}

/* forms */
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{resize:vertical;min-height:84px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.9rem}
.checks input{accent-color:var(--accent);width:17px;height:17px}
.searchbox{position:relative;margin:14px 0 10px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{padding-left:40px}
details.tpl{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--surface)}
details.tpl summary{padding:12px 14px;font-weight:600;cursor:pointer}
details.tpl .inner{padding:0 14px 14px}
code{background:var(--sunk);padding:1px 5px;border-radius:5px;font-size:.82em}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav.tabs div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;color:var(--muted);font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:580px;margin:auto auto 0;border-radius:22px 22px 0 0;max-height:93vh}
dialog::backdrop{background:var(--scrim)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet{padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:93vh}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{font-size:1.22rem}
.x{background:var(--sunk);border:0;border-radius:999px;width:36px;height:36px;font-size:1.15rem;line-height:1;flex:none}
#msg{min-height:250px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:14px;font-weight:600;font-size:.9rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:transparent;border:0;color:var(--accent);font-weight:700;padding:4px 8px;filter:brightness(1.4)}
.toast:not(.has-act){padding-right:16px}
@media (prefers-reduced-motion: reduce){dialog[open]{animation:none}.toast{transition:none}.topbar .t{transition:none}}
@media (min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" hidden></button>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet" id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>

<script>
(function(){
"use strict";
/* ================= constants ================= */
const KEY='taal-v2', OLD_KEY='taal-choreo-v1';
const STEPS=[{k:'final',l:'Final'},{k:'edit',l:'Edit'},{k:'choreo',l:'Choreo'},{k:'teach',l:'Teach'},{k:'practice',l:'Practice'}];
const STEP_DONE=['Song finalised','Editing done','Choreography done','Taught','Practice done'];
const NEXT_UI=['Song not final','Needs editing','Needs choreography','To teach','Practice pending','Ready'];
const STAGE_SHORT=['Finalise','Edit','Choreo','Teach','Practice'];
const TODO_HEAD=['Get songs finalised','Edit the tracks','Choreograph','Teach','Practice and polish'];
const EMO=['🎶','✂️','📝','💃','🔁','✅'];
const FUNCS=['Sangeet','Wedding entry','Haldi','Mehendi','Cocktail','Reception','Baraat','Carnival','School / College','Corporate','Other'];
const FORMATS=['Solo','Couple','Group','Flash mob'];
const STATUSES=[{k:'enquiry',l:'Enquiry'},{k:'booked',l:'Booked'},{k:'done',l:'Completed'},{k:'cancelled',l:'Cancelled'}];
const SOURCES=['Instagram','Referral','WedMeGood','WeddingWire','Google','Walk-in','Repeat client','Other'];
const PLACES=['Studio','Client’s home','Venue','Online'];
const MODES=['UPI','Cash','Bank transfer','Card','Cheque'];
const CHARGE_PRESETS=['Choreography package','Extra song','Extra rehearsal','Props','Background dancers','Travel','Song editing','Discount'];

const TPL_ORDER=['update','finalize','practice','rehearsal','payment','receipt','runsheet','thanks','custom'];
const TPL_NAMES={update:'Progress update',finalize:'Finalise songs',practice:'Practice reminder',rehearsal:'Rehearsal reminder',payment:'Payment reminder',receipt:'Payment receipt',runsheet:'Run sheet for DJ',thanks:'Thank you & review',custom:'Custom',tutorial:'Practice video'};
const DEFAULTS={
hinglish:{
 update:"Hi {client} 😊\n\n*{event}* ka choreography update:\n\n{statusList}\n\n✅ {readyCount}/{totalCount} songs ready. {countdown}\n\n— {studio}",
 finalize:"Hi {client} 😊\n\n{event} ke liye ye songs abhi final karne baaki hain:\n\n{finalizeList}\n\nPlease jaldi confirm kar dijiye taaki editing aur choreography start ho sake 🙏\n\n— {studio}",
 practice:"Hi {client} 😊\n\nIn songs ki choreography ho chuki hai, bas practice baaki hai:\n\n{practiceList}\n\nRoz ek baar video ke saath practice kar lijiye 💃 {countdown}\n\n— {studio}",
 rehearsal:"Hi {client} 😊\n\nReminder: agli rehearsal *{rehearsalDate}, {rehearsalTime}* ko hai.\n📍 {rehearsalPlace}\n🎵 {rehearsalItems}\n\nSabko time pe aane ko bol dijiye, aur comfortable shoes pehen ke aayein 👟\n\n— {studio}",
 payment:"Hi {client} 😊\n\n{event} choreography ka payment update:\n\nTotal: {total}\nReceived: {paid}\n*Balance: {balance}*\n{upiLine}\nJab convenient ho, transfer karke screenshot bhej dijiye 🙏\n\n— {studio}",
 receipt:"Hi {client} 😊\n\n{lastAmount} receive ho gaya hai ({lastMode}, {lastDate}). Thank you! 🙏\n\nTotal: {total}\nReceived: {paid}\nBalance: {balance}\n\n— {studio}",
 runsheet:"*Run sheet: {event}*\n📅 {date}\n📍 {venue}\n\n{runSheet}\n\n— {studio}",
 thanks:"Hi {client} 😊\n\nAapke {event} mein kaam karke bahut maza aaya! Thank you for trusting us 💃🕺\n\nAgar experience accha laga ho to ek chhota sa review de dijiye, bahut help hogi 🙏\n\n— {studio}",
 custom:"Hi {client} 😊\n\n\n\n— {studio}",
 tutorial:"🎵 *{song}* ({performance})\n\nPractice video: {tutorialLink}\n\nRoz 2-3 baar video ke saath practice karein 💃\n\n— {studio}"

function fmtTime(t){if(!t) return '';const [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';return ((h%12)||12)+(m?':'+pad(m):'')+' '+ap}
function parseDur(v){v=String(v||'').trim().replace('.',':');if(!v) return 0;if(v.includes(':')){const [m,s]=v.split(':');return (parseInt(m)||0)*60+(parseInt(s)||0)}return Math.round((parseFloat(v)||0)*60)}

function blank(){return {v:2,clients:[],settings:{name:'',studio:'',phone:'',upi:'',lang:'hinglish',theme:'auto',templates:{}},updatedAt:0}}
function normalize(s){
  const b=blank(); s=s&&typeof s==='object'?s:{};
  const st=s.settings||{};
  b.settings={...b.settings,...st,templates:{}};
  const tp=st.templates||{};
  if(s.v===2) b.settings.templates={...tp};
  else Object.keys(tp).forEach(k=>{if(tp[k]&&tp[k]!==V1_TPL[k]) b.settings.templates[k==='full'?'update':k]=tp[k]}); // keep only v1 templates she edited
  b.clients=(Array.isArray(s.clients)?s.clients:[]).map(c=>({
    id:c.id||uid(),name:c.name||'Client',phone:c.phone||'',event:c.event||'',date:c.date||'',venue:c.venue||'',
    status:c.status||'booked',source:c.source||'',notes:c.notes||'',createdAt:c.createdAt||Date.now(),
    songsIncluded:c.songsIncluded||'',rehearsalsIncluded:c.rehearsalsIncluded||'',
    performances:(c.performances||[]).map(p=>({id:p.id||uid(),title:p.title||'Performance',type:p.type||'',format:p.format||'',people:p.people||'',props:p.props||'',
      performers:(p.performers||[]).map(x=>({id:x.id||uid(),name:x.name||''})),
      songs:(p.songs||[]).map(x=>({id:x.id||uid(),title:x.title||'Song',artist:x.artist||'',dur:x.dur||0,cut:x.cut||'',ref:x.ref||'',tutorial:x.tutorial||'',notes:x.notes||'',steps:x.steps||{}}))})),
    rehearsals:(c.rehearsals||[]).map(r=>({id:r.id||uid(),date:r.date||todayISO(),time:r.time||'',mins:r.mins||90,place:r.place||'Studio',perfIds:r.perfIds||[],notes:r.notes||'',status:r.status||'planned',attendance:r.attendance||{}})),
    charges:(c.charges||[]).map(x=>({id:x.id||uid(),label:x.label||'Charge',amount:num(x.amount)})),
    payments:(c.payments||[]).map(x=>({id:x.id||uid(),date:x.date||todayISO(),amount:num(x.amount),mode:x.mode||'UPI',note:x.note||''}))
  }));
  b.updatedAt=s.updatedAt||0; return b;
}

function save(){

async function pushDb(){
  if(!dbRef) return; if(dbBusy){dbAgain=true;return}
  dbBusy=true;
  try{await dbRef.set({json:JSON.stringify(state),updatedAt:state.updatedAt});syncLabel='Synced to your Claude account'}
  catch(e){syncLabel='Saved on this device (account sync paused)'}
  dbBusy=false; if(dbAgain){dbAgain=false;pushDb()}
}
(async function connect(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    window.claude.use('downloads').then(d=>{dlCap=d}).catch(()=>{});
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.collection('data/users/'+id).doc('state');
    const snap=await ref.get(); dbRef=ref;
    if(snap.exists){
      let remote=null;try{remote=normalize(JSON.parse((snap.data()||{}).json||'{}'))}catch(e){}
      if(remote&&(remote.updatedAt||0)>(state.updatedAt||0)){
        state=remote;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
        syncLabel='Synced to your Claude account';applyTheme();render(false);return;
      }
    }
    syncLabel='Synced to your Claude account';
    if(state.updatedAt) pushDb();
    if(cur().v==='more') render(false);
  }catch(e){dbRef=null}
})();
async function downloadFile(name,text,type){
  if(dlCap){try{await dlCap.save({filename:name,data:new Blob([text],{type})});return true}catch(e){if(e&&e.code==='declined') return false}}
  try{const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);return true}catch(e){return false}
}

const getR=(c,id)=>c&&c.rehearsals.find(r=>r.id===id);
function nextIdx(s){for(let i=0;i<STEPS.length;i++) if(!s.steps[STEPS[i].k]) return i;return 5}
const doneN=s=>STEPS.filter(st=>s.steps[st.k]).length;
const songsOf=c=>c.performances.flatMap(p=>p.songs);
const readyOf=c=>songsOf(c).filter(s=>nextIdx(s)===5).length;
function totals(c){const total=c.charges.reduce((a,x)=>a+x.amount,0),paid=c.payments.reduce((a,x)=>a+x.amount,0);return {total,paid,bal:total-paid}}
const isActive=c=>c.status==='booked'||c.status==='enquiry';
function upcomingReh(c){const t=todayISO();return c.rehearsals.filter(r=>r.status==='planned'&&r.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function perfNames(c,ids){return (ids||[]).map(id=>getP(c,id)).filter(Boolean).map(p=>p.title)}
function rehPerformers(c,r){const ids=r.perfIds&&r.perfIds.length?r.perfIds:c.performances.map(p=>p.id);const seen={},out=[];ids.forEach(id=>{const p=getP(c,id);if(p) p.performers.forEach(x=>{const k=x.name.toLowerCase();if(!seen[k]){seen[k]=1;out.push(x)}})});return out}
function attendCount(c,r){const ps=rehPerformers(c,r);return {n:ps.filter(p=>r.attendance[p.id]).length,of:ps.length}}
function whenBadge(c){
  const d=daysLeft(c.date);if(d===null||c.status==='cancelled') return '';
  if(d<0) return c.status==='done'?'':'<span class="badge">Event passed</span>';
  const txt=d===0?'Event today':d===1?'Tomorrow':d+' days left';
  const all=songsOf(c).length;
  return `<span class="badge ${d<=7&&readyOf(c)<all?'b-soon':''}">${txt}</span>`;
}
const statusBadge=c=>`<span class="badge b-${c.status}">${(STATUSES.find(s=>s.k===c.status)||{}).l||''}</span>`;
function eqBars(songs){
  if(!songs.length) return '<span class="count">No songs yet</span>';
  return songs.map(s=>{const n=doneN(s);return `<i style="--h:${n/5}" class="${n===0?'zero':n===5?'full':''}"></i>`}).join('');
}
function gcalLink(c,r){
  const start=(r.date+'T'+(r.time||'10:00')).replace(/[-:]/g,'')+'00';
  const sd=new Date(r.date+'T'+(r.time||'10:00')+':00');sd.setMinutes(sd.getMinutes()+(+r.mins||90));
  const end=isoOf(sd).replace(/-/g,'')+'T'+pad(sd.getHours())+pad(sd.getMinutes())+'00';
  const q=new URLSearchParams({action:'TEMPLATE',text:'Rehearsal: '+c.name,dates:start+'/'+end,details:(perfNames(c,r.perfIds).join(', ')||'Rehearsal')+(r.notes?'\n'+r.notes:''),location:r.place==='Venue'&&c.venue?c.venue:r.place});

  const q1=P('Annual day group','School / College','Group',[],[S('Jai Ho','Slumdog Millionaire','3:00',2),S('Desi Girl','Dostana','2:40',1)]);
  const c2={id:uid(),name:'St. Mary’s School',phone:'',event:'Annual day',date:addDays(t,34),venue:'School auditorium',status:'booked',source:'Referral',notes:'40 students, classes 6 to 8.',createdAt:Date.now(),songsIncluded:'2',rehearsalsIncluded:'10',performances:[q1],rehearsals:[{id:uid(),date:addDays(t,1),time:'15:00',mins:60,place:'Venue',perfIds:[q1.id],notes:'',status:'planned',attendance:{}}],charges:[{id:uid(),label:'Choreography package',amount:30000}],payments:[{id:uid(),date:addDays(t,-3),amount:10000,mode:'Bank transfer',note:'Advance'}]};
  const c3={id:uid(),name:'Mehta family',phone:'',event:'Mehta wedding, groom entry',date:addDays(t,60),venue:'',status:'enquiry',source:'WedMeGood',notes:'Called about a groom entry and family dance. Send package rates.',createdAt:Date.now(),songsIncluded:'',rehearsalsIncluded:'',performances:[],rehearsals:[],charges:[],payments:[]};
  const c4={id:uid(),name:'Sneha Kapoor',phone:'',event:'Sneha’s sangeet',date:addDays(t,-12),venue:'Royal Orchid',status:'done',source:'Repeat client',notes:'',createdAt:Date.now(),songsIncluded:'4',rehearsalsIncluded:'6',performances:[P('Sisters group','Sangeet','Group',['Sneha','Tanya','Meher'],[S('Nagada Sang Dhol','Ram-Leela','2:50',5),S('Morni Banke','Badhaai Ho','2:30',5)])],rehearsals:[],charges:[{id:uid(),label:'Choreography package',amount:25000}],payments:[{id:uid(),date:addDays(t,-40),amount:10000,mode:'UPI',note:'Advance'},{id:uid(),date:addDays(t,-12),amount:15000,mode:'Cash',note:'Final'}]};
  state.clients.push(c1,c2,c3,c4);
  if(!state.settings.studio) state.settings.studio='Steps Studio';
  save();render(true);toast('Sample data added. Delete it any time from Settings.');
}

/* ================= events ================= */
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b) return;
  const a=b.dataset.act,c=getC(b.dataset.c),p=getP(c,b.dataset.p),s=getS(p,b.dataset.s);
  const t=b.dataset.t;
  switch(a){
    case 'nav':tab(b.dataset.v);break;
    case 'back':back();break;
    case 'open':go('client',{c:b.dataset.c,tab:t||'songs'});break;
    case 'ctab':cur().tab=t;render(false);break;
    case 'clientsFilter':ui.clientFilter=b.dataset.f;ui.q='';if(cur().v!=='clients') tab('clients');else render(false);break;
    case 'schedSeg':ui.schedSeg=b.dataset.s;render(false);break;
    case 'todo':ui.todoStage=+b.dataset.s;go('todo');break;
    case 'todoStage':ui.todoStage=+b.dataset.s;render(false);break;
    case 'sample':sample();break;
    case 'close':closeSheet();break;
    case 'toastAct':{const fn=toastFn;toastFn=null;$('#toast').classList.remove('show');if(fn) fn();break;}

    case 'newClient':clientForm();break;
    case 'editClient':clientForm(c);break;
    case 'saveClient':{
      const name=val('f_name');if(!name){toast('Add the client’s name');$('#f_name').focus();return}
      const d={name,phone:val('f_phone'),event:val('f_event'),date:val('f_date'),status:val('f_status')||'booked',venue:val('f_venue'),songsIncluded:val('f_songsInc'),rehearsalsIncluded:val('f_rehInc'),source:val('f_source'),notes:val('f_notes')};
      if(c){Object.assign(c,d);save();closeSheet();render(false);toast('Client saved')}
      else{
        const nc={id:uid(),createdAt:Date.now(),performances:[],rehearsals:[],charges:[],payments:[],...d};
        const pk=num(val('f_pkg')),adv=num(val('f_adv'));
        if(pk) nc.charges.push({id:uid(),label:'Choreography package'+(d.songsIncluded?' ('+d.songsIncluded+' songs)':''),amount:pk});
        if(adv) nc.payments.push({id:uid(),date:todayISO(),amount:adv,mode:'UPI',note:'Advance'});
        state.clients.push(nc);save();closeSheet();go('client',{c:nc.id,tab:'songs'});toast('Client added');
      }break;}
    case 'delClient':{const sn=snap();state.clients=state.clients.filter(x=>x!==c);save();ui.stack=[{v:'clients'}];render(true);toast(c.name+' deleted',sn);break;}
    case 'setStatus':c.status=b.dataset.s;save();render(false);toast('Marked '+(STATUSES.find(x=>x.k===c.status)||{}).l.toLowerCase());break;

    case 'newPerf':perfForm(c);break;
    case 'editPerf':perfForm(c,p);break;
    case 'savePerf':{
      const title=val('f_title');if(!title){toast('Add a performance name');return}
      const names=val('f_perfs').split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
      const old=p?p.performers:[];
      const performers=names.map(n=>old.find(o=>o.name.toLowerCase()===n.toLowerCase())||{id:uid(),name:n});
      const d={title,type:val('f_type'),format:val('f_format'),props:val('f_props'),performers};
      if(p) Object.assign(p,d);else c.performances.push({id:uid(),people:'',songs:[],...d});
      save();closeSheet();render(false);toast(p?'Performance saved':'Performance added');break;}
    case 'delPerf':{const sn=snap();c.performances=c.performances.filter(x=>x!==p);c.rehearsals.forEach(r=>r.perfIds=r.perfIds.filter(id=>id!==p.id));save();closeSheet();render(false);toast(p.title+' deleted',sn);break;}
    case 'movePerf':{const i=c.performances.indexOf(p),j=i+(+b.dataset.d);if(j<0||j>=c.performances.length) return;[c.performances[i],c.performances[j]]=[c.performances[j],c.performances[i]];save();render(false);break;}

    case 'newSong':songForm(c,p);setTimeout(()=>{const f=$('#f_stitle');if(f) f.focus()},60);break;
    case 'editSong':songForm(c,p,s);break;
    case 'saveSong':{
      const title=val('f_stitle');if(!title){toast('Add the song name');return}
      const d={title,artist:val('f_artist'),dur:parseDur(val('f_dur')),cut:val('f_cut'),ref:val('f_ref'),tutorial:val('f_tut'),notes:val('f_snotes')};
      if(s){Object.assign(s,d);const mv=val('f_move');if(mv&&mv!==p.id){const np=getP(c,mv);if(np){p.songs=p.songs.filter(x=>x!==s);np.songs.push(s)}}}
      else p.songs.push({id:uid(),steps:{},...d});
      save();render(false);
      if(b.dataset.more){songForm(c,p);toast('Song added');setTimeout(()=>{const f=$('#f_stitle');if(f) f.focus()},60)}else{closeSheet();toast(s?'Song saved':'Song added')}
      break;}
    case 'delSong':{const sn=snap();p.songs=p.songs.filter(x=>x!==s);save();closeSheet();render(false);toast(s.title+' deleted',sn);break;}
    case 'toggle':{const k=b.dataset.k;s.steps[k]=!s.steps[k];save();render(false);const i=STEPS.findIndex(x=>x.k===k);
      if(s.steps[k]&&nextIdx(s)===5) toast('🎉 '+s.title+' is ready');else toast(s.steps[k]?STEP_DONE[i]+': '+s.title:STEPS[i].l+' unmarked');break;}
    case 'shareTut':ui.compose={c:c.id,t:'tutorial',pid:p.id,sid:s.id};composer();break;

    case 'newReh':rehForm(c);break;
    case 'editReh':rehForm(c,getR(c,b.dataset.r));break;
    case 'saveReh':{
      let cc=c;const sel=val('f_client');if(sel) cc=getC(sel)||c;
      const r=cc&&getR(cc,b.dataset.r);
      const date=val('f_rdate');if(!date){toast('Pick a date');return}
      const perfIds=[...document.querySelectorAll('input[name=rp]:checked')].map(x=>x.value);
      const attendance={};document.querySelectorAll('input[name=att]:checked').forEach(x=>attendance[x.value]=true);
      const d={date,time:val('f_rtime'),mins:+val('f_rmins')||90,place:val('f_rplace'),perfIds,status:val('f_rstatus')||'planned',notes:val('f_rnotes'),attendance};
      if(r) Object.assign(r,d);else cc.rehearsals.push({id:uid(),...d});
      save();closeSheet();render(false);toast(r?'Rehearsal saved':'Rehearsal scheduled for '+dayLabel(date));break;}
    case 'delReh':{const r=getR(c,b.dataset.r);const sn=snap();c.rehearsals=c.rehearsals.filter(x=>x!==r);save();closeSheet();render(false);toast('Rehearsal deleted',sn);break;}

    case 'newPay':payForm(c);break;
    case 'editPay':payForm(c,c.payments.find(x=>x.id===b.dataset.x));break;
    case 'savePay':{
      let cc=c;const sel=val('f_client');if(sel) cc=getC(sel)||c;
      const x=cc.payments.find(y=>y.id===b.dataset.x),amount=num(val('f_amt'));
      if(!amount){toast('Enter the amount');return}
      const d={amount,date:val('f_pdate')||todayISO(),mode:val('f_mode'),note:val('f_pnote')};
      if(x) Object.assign(x,d);else cc.payments.push({id:uid(),...d});
      save();closeSheet();render(false);
      if(!x) toast(money(amount)+' recorded',{label:'Send receipt',fn:()=>{ui.compose={c:cc.id,t:'receipt'};composer()}});else toast('Payment saved');
      break;}
    case 'delPay':{const sn=snap();c.payments=c.payments.filter(x=>x.id!==b.dataset.x);save();closeSheet();render(false);toast('Payment deleted',sn);break;}
    case 'newCharge':chargeForm(c);break;
    case 'editCharge':chargeForm(c,c.charges.find(x=>x.id===b.dataset.x));break;
    case 'saveCharge':{
      const x=c.charges.find(y=>y.id===b.dataset.x),label=val('f_clabel'),amount=num(val('f_camt'));
      if(!label||!amount){toast('Add a name and amount');return}
      if(x) Object.assign(x,{label,amount});else c.charges.push({id:uid(),label,amount});
      save();closeSheet();render(false);toast(x?'Charge saved':'Charge added');break;}
    case 'delCharge':{const sn=snap();c.charges=c.charges.filter(x=>x.id!==b.dataset.x);save();closeSheet();render(false);toast('Charge deleted',sn);break;}

    case 'compose':ui.compose={c:c.id,t:t||'update',rid:b.dataset.r||null};composer();break;
    case 'tpl':ui.compose.t=t;composer();break;
    case 'copyMsg':try{await navigator.clipboard.writeText($('#msg').value);toast('Message copied')}catch(err){$('#msg').select();toast('Select all and copy')}break;

    case 'setPref':state.settings[b.dataset.k]=b.dataset.v;save();applyTheme();render(false);break;
    case 'resetTpl':delete state.settings.templates[b.dataset.k];save();render(false);toast('Template reset');break;
    case 'exportFile':{const ok=await downloadFile('taal-backup-'+todayISO()+'.json',JSON.stringify({app:'taal',...state},null,1),'application/json');toast(ok?'Backup saved':'Couldn’t save the file. Try “Copy as text”.');break;}
    case 'copyBackup':{const txt=JSON.stringify({app:'taal',...state});try{await navigator.clipboard.writeText(txt);toast('Backup copied. Paste it somewhere safe.')}catch(err){const bx=$('#backupBox');bx.value=txt;bx.closest('details').open=true;bx.select();toast('Backup shown below, copy it')}break;}
    case 'importPick':$('#importFile').click();break;
    case 'restorePaste':restoreFrom($('#backupBox').value);break;
    case 'doRestore':{const d=ui.pendingRestore;if(!d) return;ui.pendingRestore=null;const sn=snap();state=normalize(d);save();applyTheme();closeSheet();tab('home');toast('Backup restored',sn);break;}
    case 'wipe':{const sn=snap();const st=state.settings;state=blank();state.settings=st;save();tab('home');toast('All data deleted',sn);break;}
  }
});
function restoreFrom(text){
  text=String(text||'').trim();if(!text){toast('Paste a backup first');return}
  let d;try{d=JSON.parse(text);if(!Array.isArray(d.clients)) throw 0}catch(e){toast('That doesn’t look like a Taal backup');return}
  ui.pendingRestore=d;
  openSheet('Restore this backup?',`<p>It has ${d.clients.length} client${d.clients.length===1?'':'s'}${d.updatedAt?', last changed '+esc(fmtDate(isoOf(new Date(d.updatedAt)))):''}. Everything currently in the app will be replaced.</p><div class="btns fill"><button class="btn primary" data-act="doRestore">Restore backup</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
}
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f) return;const rd=new FileReader();rd.onload=()=>restoreFrom(rd.result);rd.readAsText(f);e.target.value=''});

let setTimer=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='msg'||t.id==='toPhone'){updateWaLink();return}
  if(t.id==='q'){ui.q=t.value;$('#clientList').innerHTML=clientListHTML();return}
  if(t.dataset.set){state.settings[t.dataset.set]=t.value;clearTimeout(setTimer);setTimer=setTimeout(save,400);return}
  if(t.dataset.tpl){state.settings.templates[t.dataset.tpl]=t.value;clearTimeout(setTimer);setTimer=setTimeout(save,400);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if((t.name==='rp'||t.id==='f_client')&&$('#rehPerfs')){
    const sel=val('f_client'),btn=document.querySelector('[data-act=saveReh]');
    const c=getC(sel||(btn&&btn.dataset.c));if(!c) return;
    if(btn&&sel) btn.dataset.c=c.id;
    const r=(btn&&getR(c,btn.dataset.r))||{perfIds:[],attendance:{}};
    const tmp={...r,perfIds:t.id==='f_client'?[]:[...document.querySelectorAll('input[name=rp]:checked')].map(x=>x.value),attendance:{...r.attendance}};
    document.querySelectorAll('input[name=att]:checked').forEach(x=>tmp.attendance[x.value]=true);
    $('#rehPerfs').innerHTML=rehPerfsHTML(c,tmp);
  }
  if(t.id==='f_client'&&document.querySelector('[data-act=savePay]')){const c=getC(t.value);const sm=$('#f_amt')&&$('#f_amt').nextElementSibling;if(c){const bal=totals(c).bal;$('#f_amt').placeholder=bal>0?bal:'';if(sm&&sm.tagName==='SMALL') sm.textContent=bal>0?'Balance is '+money(bal):''}}
});

applyTheme();
render(true);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
