<script>
(function(){
"use strict";
const {LEAD_CHOICES,STEPS,V1_TPL,uid,pad,isoOf,todayISO,addDays,daysLeft,fmtDate,dayLabel,fmtTime,parseDur,fmtDur,money,num,waNumber,waHref,nextIdx,doneN,nextStepKey,nextStepLabel,nextStepDoneLabel,songsOf,readyOf,totals,isActive,upcomingReh,blank,normalize,BACKUP_MARKER,backupFileName,parseBackup}=window.TaalCore;
/* ================= constants ================= */
const KEY='taal-v2', OLD_KEY='taal-choreo-v1';
const STEP_DONE=['Song finalised','Editing done','Choreography done','Taught','Practice done'];
const NEXT_UI=['Song not final','Needs editing','Needs choreography','To teach','Practice pending','Ready'];
const STAGE_SHORT=['Finalise','Edit','Choreo','Teach','Practice'];
const TODO_HEAD=['Get songs finalised','Edit the tracks','Choreograph','Teach','Practice and polish'];
const EMO=['🎶','✂️','📝','💃','🔁','✅'];
const FUNCS=['Sangeet','Wedding entry','Haldi','Mehendi','Cocktail','Reception','Baraat','Carnival','School / College','Corporate','Other'];
const FORMATS=['Solo','Couple','Group','Flash mob'];
const STATUSES=[{k:'enquiry',l:'Enquiry'},{k:'booked',l:'Booked'},{k:'done',l:'Completed'},{k:'cancelled',l:'Cancelled'}];
const SOURCES=['Instagram','Referral','WedMeGood','WeddingWire','Google','Walk-in','Repeat client','Other'];
const PLACES=['Studio','Client’s home','Venue','Online'];
const MODES=['UPI','Cash','Bank transfer','Card','Cheque'];
const CHARGE_PRESETS=['Choreography package','Extra song','Extra rehearsal','Props','Background dancers','Travel','Song editing','Discount'];

const TPL_ORDER=['update','finalize','practice','rehearsal','payment','receipt','runsheet','thanks','custom'];
const TPL_CHIP={update:'Progress',finalize:'Finalise',practice:'Practice',rehearsal:'Rehearsal',payment:'Payment',receipt:'Receipt',runsheet:'Run sheet',thanks:'Thank you',custom:'Custom'};
const TPL_NAMES={update:'Progress update',finalize:'Finalise songs',practice:'Practice reminder',rehearsal:'Rehearsal reminder',payment:'Payment reminder',receipt:'Payment receipt',runsheet:'Run sheet for DJ',thanks:'Thank you & review',custom:'Custom',tutorial:'Practice video'};
const DEFAULTS={
hinglish:{
 update:"Hi {client} 😊\n\n*{event}* ka choreography update:\n\n{statusList}\n\n✅ {readyCount}/{totalCount} songs ready. {countdown}\n\n— {studio}",
 finalize:"Hi {client} 😊\n\n{event} ke liye ye songs abhi final karne baaki hain:\n\n{finalizeList}\n\nPlease jaldi confirm kar dijiye taaki editing aur choreography start ho sake 🙏\n\n— {studio}",
 practice:"Hi {client} 😊\n\nIn songs ki choreography ho chuki hai, bas practice baaki hai:\n\n{practiceList}\n\nRoz ek baar video ke saath practice kar lijiye 💃 {countdown}\n\n— {studio}",
 rehearsal:"Hi {client} 😊\n\nReminder: agli rehearsal *{rehearsalDate}, {rehearsalTime}* ko hai.\n📍 {rehearsalPlace}\n🎵 {rehearsalItems}\n\nSabko time pe aane ko bol dijiye, aur comfortable shoes pehen ke aayein 👟\n\n— {studio}",
 payment:"Hi {client} 😊\n\n{event} choreography ka payment update:\n\nTotal: {total}\nReceived: {paid}\n*Balance: {balance}*\n{upiLine}\nJab convenient ho, transfer karke screenshot bhej dijiye 🙏\n\n— {studio}",
 receipt:"Hi {client} 😊\n\n{lastAmount} receive ho gaya hai ({lastMode}, {lastDate}). Thank you! 🙏\n\nTotal: {total}\nReceived: {paid}\nBalance: {balance}\n\n— {studio}",
 runsheet:"*Run sheet: {event}*\n📅 {date}\n📍 {venue}\n\n{runSheet}\n\n— {studio}",
 thanks:"Hi {client} 😊\n\nAapke {event} mein kaam karke bahut maza aaya! Thank you for trusting us 💃🕺\n\nAgar experience accha laga ho to ek chhota sa review de dijiye, bahut help hogi 🙏\n\n— {studio}",
 custom:"Hi {client} 😊\n\n\n\n— {studio}",
 tutorial:"🎵 *{song}* ({performance})\n\nPractice video: {tutorialLink}\n\nRoz 2-3 baar video ke saath practice karein 💃\n\n— {studio}"
},
english:{
 update:"Hi {client} 😊\n\nHere’s the choreography update for *{event}*:\n\n{statusList}\n\n✅ {readyCount} of {totalCount} songs ready. {countdown}\n\n— {studio}",
 finalize:"Hi {client} 😊\n\nThese songs for {event} still need to be finalised:\n\n{finalizeList}\n\nPlease confirm soon so we can start editing and choreography 🙏\n\n— {studio}",
 practice:"Hi {client} 😊\n\nChoreography is done for these songs, only practice is left:\n\n{practiceList}\n\nPlease practise once a day with the video 💃 {countdown}\n\n— {studio}",
 rehearsal:"Hi {client} 😊\n\nReminder: the next rehearsal is on *{rehearsalDate} at {rehearsalTime}*.\n📍 {rehearsalPlace}\n🎵 {rehearsalItems}\n\nPlease ask everyone to be on time and wear comfortable shoes 👟\n\n— {studio}",
 payment:"Hi {client} 😊\n\nPayment update for the {event} choreography:\n\nTotal: {total}\nReceived: {paid}\n*Balance: {balance}*\n{upiLine}\nPlease share a screenshot once transferred 🙏\n\n— {studio}",
 receipt:"Hi {client} 😊\n\nReceived {lastAmount} ({lastMode}, {lastDate}). Thank you! 🙏\n\nTotal: {total}\nReceived: {paid}\nBalance: {balance}\n\n— {studio}",
 runsheet:"*Run sheet: {event}*\n📅 {date}\n📍 {venue}\n\n{runSheet}\n\n— {studio}",
 thanks:"Hi {client} 😊\n\nIt was a joy working on your {event}! Thank you for trusting us 💃🕺\n\nIf you enjoyed the experience, a short review would mean a lot 🙏\n\n— {studio}",
 custom:"Hi {client} 😊\n\n\n\n— {studio}",
 tutorial:"🎵 *{song}* ({performance})\n\nPractice video: {tutorialLink}\n\nPlease practise with it 2-3 times a day 💃\n\n— {studio}"
}};
const STATUS_MSG={
 hinglish:['Song finalize karna baaki','Editing chal rahi hai','Choreography baaki','Sikhana baaki','Bas practice baaki','Ready'],
 english:['Song to be finalised','Editing in progress','Choreography pending','To be taught','Practice pending','Ready']};

const ICON={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.6 6.5-5.6s5.7 2 6.5 5.6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5c2.6.3 4.4 2.1 5 5"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18M16 15h2"/>',
 more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
 wa:'<path d="M4 20l1.3-3.8A8 8 0 1 1 8 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 chev:'<path d="m9 5 7 7-7 7"/>',
 play:'<path d="M8 5.5v13l10.5-6.5z"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 up:'<path d="m6 15 6-6 6 6"/>',
 down:'<path d="m6 9 6 6 6-6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 calplus:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>'
};
const ic=(n,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}

/* ================= state ================= */
let state=blank();
try{const raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);if(raw) state=normalize(JSON.parse(raw))}catch(e){}

let ui={stack:[{v:'home'}],clientFilter:'booked',q:'',schedSeg:'upcoming',todoStage:-1,compose:null,pendingBack:false};
const syncLabel='Saved on this device';

/* ================= persistence ================= */
function save(){state.updatedAt=Date.now();quietSave()}
function quietSave(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
}
async function downloadFile(name,text,type){
  try{const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);return true}catch(e){return false}
}

/* ================= domain helpers ================= */
const getC=id=>state.clients.find(c=>c.id===id);
const getP=(c,id)=>c&&c.performances.find(p=>p.id===id);
const getS=(p,id)=>p&&p.songs.find(s=>s.id===id);
const getR=(c,id)=>c&&c.rehearsals.find(r=>r.id===id);
function perfNames(c,ids){return (ids||[]).map(id=>getP(c,id)).filter(Boolean).map(p=>p.title)}
function rehPerformers(c,r){const ids=r.perfIds&&r.perfIds.length?r.perfIds:c.performances.map(p=>p.id);const seen={},out=[];ids.forEach(id=>{const p=getP(c,id);if(p) p.performers.forEach(x=>{const k=x.name.toLowerCase();if(!seen[k]){seen[k]=1;out.push(x)}})});return out}
function attendCount(c,r){const ps=rehPerformers(c,r);return {n:ps.filter(p=>r.attendance[p.id]).length,of:ps.length}}
function whenBadge(c){
  const d=daysLeft(c.date);if(d===null||c.status==='cancelled') return '';
  if(d<0) return c.status==='done'?'':'<span class="badge">Event passed</span>';
  const txt=d===0?'Event today':d===1?'Tomorrow':d+' days left';
  const all=songsOf(c).length;
  return `<span class="badge ${d<=7&&readyOf(c)<all?'b-soon':''}">${txt}</span>`;
}
const statusBadge=c=>`<span class="badge b-${c.status}">${(STATUSES.find(s=>s.k===c.status)||{}).l||''}</span>`;
function gcalLink(c,r){
  const start=(r.date+'T'+(r.time||'10:00')).replace(/[-:]/g,'')+'00';
  const sd=new Date(r.date+'T'+(r.time||'10:00')+':00');sd.setMinutes(sd.getMinutes()+(+r.mins||90));
  const end=isoOf(sd).replace(/-/g,'')+'T'+pad(sd.getHours())+pad(sd.getMinutes())+'00';
  const q=new URLSearchParams({action:'TEMPLATE',text:'Rehearsal: '+c.name,dates:start+'/'+end,details:(perfNames(c,r.perfIds).join(', ')||'Rehearsal')+(r.notes?'\n'+r.notes:''),location:r.place==='Venue'&&c.venue?c.venue:r.place});
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}

/* ================= messages ================= */
const lang=()=>state.settings.lang==='english'?'english':'hinglish';
const tplText=k=>state.settings.templates[k]??DEFAULTS[lang()][k]??'';
const studioSig=()=>state.settings.studio||state.settings.name||'';
function msgVars(c,ctx={}){
  const L=lang(),SM=STATUS_MSG[L],all=songsOf(c);
  const line=s=>{const i=nextIdx(s);return `${EMO[i]} ${s.title}: ${SM[i]}`};
  const list=f=>{const x=all.filter(f).map(s=>'• '+s.title);return x.length?x.join('\n'):'—'};
  const d=daysLeft(c.date);
  const countdown=d===null||d<0?'':d===0?(L==='english'?'The event is today! 🎉':'Aaj event hai! 🎉'):(L==='english'?`Only ${d} day${d>1?'s':''} to go!`:`Event mein sirf ${d} din baaki hain!`);
  const r=(ctx.rid&&getR(c,ctx.rid))||upcomingReh(c)[0];
  const {total,paid,bal}=totals(c);
  const last=c.payments.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  const st=state.settings;
  let tot=0;
  const run=c.performances.map((p,i)=>{const dur=p.songs.reduce((a,s)=>a+(s.dur||0),0);tot+=dur;
    return `${i+1}. *${p.title}*${p.format?' ('+p.format+')':''}${dur?' — '+fmtDur(dur):''}`+(p.songs.length?'\n'+p.songs.map(s=>'    • '+s.title+(s.dur?' '+fmtDur(s.dur):'')).join('\n'):'')}).join('\n');
  const p=ctx.pid&&getP(c,ctx.pid), s=p&&ctx.sid&&getS(p,ctx.sid);
  return {
    client:c.name,event:c.event||(L==='english'?'your event':'aapke event'),date:fmtDate(c.date)||'—',venue:c.venue||'—',daysLeft:d===null?'':String(Math.max(d,0)),countdown,
    statusList:c.performances.filter(p=>p.songs.length).map(p=>`*${p.title}*\n`+p.songs.map(line).join('\n')).join('\n\n')||'—',
    pendingList:all.filter(s=>nextIdx(s)<5).map(line).join('\n')||'✅',
    finalizeList:list(s=>nextIdx(s)===0),practiceList:list(s=>nextIdx(s)===4),
    readyCount:String(all.filter(s=>nextIdx(s)===5).length),totalCount:String(all.length),
    rehearsalDate:r?dayLabel(r.date)+(Math.abs(daysLeft(r.date))>1?'':' ('+fmtDate(r.date,{day:'numeric',month:'short'})+')'):'—',
    rehearsalTime:r?fmtTime(r.time)||'—':'—',rehearsalPlace:r?(r.place==='Venue'&&c.venue?c.venue:r.place):'—',
    rehearsalItems:r?(perfNames(c,r.perfIds).join(', ')||(L==='english'?'All performances':'Saari performances')):'—',
    total:money(total),paid:money(paid),balance:money(Math.max(bal,0)),
    upiLine:st.upi?`\nUPI: ${st.upi}${st.studio||st.name?' ('+(st.studio||st.name)+')':''}\n`:'',
    lastAmount:last?money(last.amount):'—',lastMode:last?last.mode:'—',lastDate:last?fmtDate(last.date,{day:'numeric',month:'short'}):'—',
    runSheet:run?(run+(tot?`\n\n⏱ Total: ${fmtDur(tot)}`:'')):'—',
    song:s?s.title:'',performance:p?p.title:'',tutorialLink:s?(s.tutorial||s.ref||''):'',
    studio:studioSig(),name:st.name||''
  };
}
const fill=(t,v)=>t.replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m).replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n');

/* ================= navigation ================= */
const cur=()=>ui.stack[ui.stack.length-1];
// Pushed screens slide in from the right and back out (View Transitions API where available).
function withTransition(dir,fn){
  const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(dir==='none'||reduce||!document.startViewTransition){fn();return}
  document.documentElement.dataset.vt=dir;
  document.startViewTransition(fn).finished.finally(()=>{delete document.documentElement.dataset.vt});
}
function go(v,params){withTransition('push',()=>{ui.stack.push({v,...(params||{})});try{history.pushState({d:ui.stack.length},'')}catch(e){}render(true)})}
function tab(v){ui.stack=[{v}];render(true)}
function back(){
  if(ui.stack.length<=1) return tab('home');
  ui.pendingBack=true;
  try{history.back()}catch(e){}
  setTimeout(()=>{if(ui.pendingBack){ui.pendingBack=false;withTransition('pop',()=>{ui.stack.pop();render(true)})}},250);
}
window.addEventListener('popstate',()=>{
  if(sheet.open){closeSheet();try{history.pushState({d:ui.stack.length},'')}catch(e){};ui.pendingBack=false;return}
  ui.pendingBack=false;
  if(ui.stack.length>1) withTransition('pop',()=>{ui.stack.pop();render(true)});
});
// Root screens: a large title, plus a compact frosted bar that fades in once the title scrolls away.
function pageHead(title,opts){
  opts=opts||{};
  return `<div class="topbar root" id="topbar"><span class="t">${title}</span>${opts.action||''}</div>
  <header class="pagehead">${opts.eyebrow?`<p class="page-sub">${opts.eyebrow}</p>`:''}<h1 class="large-title">${title}</h1>${opts.sub?`<p class="page-sub">${opts.sub}</p>`:''}</header>`;
}

/* ================= views ================= */
function emptyHero(text,btns){return `<div class="empty"><div class="eq" aria-hidden="true">${[.3,.6,1,.5,.75].map(h=>`<i style="--h:${h}"></i>`).join('')}</div><p>${text}</p><div class="btns" style="justify-content:center">${btns}</div></div>`}

// "Long event name · 16 days": only the name shortens, the countdown stays visible.
function splitTitle(t){const i=t.lastIndexOf(' · ');return i<0?`<span class="row-title">${esc(t)}</span>`:`<span class="row-title split"><span class="clip">${esc(t.slice(0,i))}</span><span class="tail">&nbsp;· ${esc(t.slice(i+3))}</span></span>`}
function homeView(){
  const st=state.settings, t=todayISO();
  const eyebrow=esc(fmtDate(t,{weekday:'long',day:'numeric',month:'long'}))+' · '+greet()+(st.name?', '+esc(st.name.split(' ')[0]):'');
  let h=pageHead('Today',{eyebrow});
  if(ui.update) h+=`<div class="group update-banner" style="margin-top:12px"><div class="row"><span class="row-main"><span class="row-title wrap">ARK Studios ${esc(ui.update.version)} is available</span><span class="row-sub wrap">Installs over this app. Your data stays.</span></span></div><div class="btns fill update-btns"><a class="btn sm primary" href="${esc(ui.update.url)}">Download</a><button class="btn sm ghost" data-act="dismissUpdate">Not now</button></div></div>`;
  if(!state.clients.length){
    return h+emptyHero('Track every client’s performances, songs, rehearsals and payments, and send WhatsApp updates in one tap.',`<button class="btn primary" data-act="newClient">${ic('plus')}Add first client</button><button class="btn ghost" data-act="sample">Explore with sample data</button><button class="btn ghost" data-act="importPick">Restore from a backup file</button>`);
  }
  // rehearsals: today's, then the next one coming up
  const {items,next}=ArkToday.todayAgenda(state,t);
  h+=`<div class="group-head"><span>Rehearsals</span><button class="link" data-act="push" data-v="schedule">Full schedule</button></div><div class="group">`;
  items.forEach(it=>{
    const c=it.client;
    if(it.kind==='event'){h+=`<button class="row" data-act="open" data-c="${c.id}"><span class="row-time">🎉</span><span class="row-main"><span class="row-title">Event day · ${esc(c.name)}</span><span class="row-sub">${esc([c.event,c.venue].filter(Boolean).join(' · ')||'Today')}</span></span>${ic('chev','row-chev')}</button>`;return}
    const r=it.rehearsal,a=attendCount(c,r),where=r.place==='Venue'&&c.venue?c.venue:r.place;
    h+=`<div class="row"><button class="row-main row-tap" data-act="editReh" data-c="${c.id}" data-r="${r.id}"><span class="row-title">${esc(fmtTime(r.time)||'Any time')} · ${esc(c.name)}</span><span class="row-sub">${esc([perfNames(c,r.perfIds).join(', ')||'All performances',where].join(' · '))}</span></button>${r.status==='planned'?`<button class="btn sm wa" data-act="compose" data-c="${c.id}" data-t="rehearsal" data-r="${r.id}">${ic('wa')}Remind</button>`:`<span class="badge b-done">${a.of?a.n+'/'+a.of:'Done'}</span>`}</div>`;
  });

// Sheets: grabber + header. Forms pass opts.save to get Cancel · title · Save; other sheets get Done.
function openSheet(title,body,opts){
  opts=opts||{};
  const sv=opts.save,data=sv?Object.entries(sv.data||{}).filter(([,v])=>v!==undefined&&v!==null).map(([k,v])=>` data-${k}="${esc(v)}"`).join(''):'';
  const head=sv?`<div class="sheet-head"><button class="link sheet-side" data-act="close">Cancel</button><h2 id="sheetTitle">${title}</h2><button class="btn primary sm sheet-save" data-act="${sv.act}"${data}>${sv.label||'Save'}</button></div>`
    :`<div class="sheet-head"><span class="sheet-side" aria-hidden="true"></span><h2 id="sheetTitle">${title}</h2><button class="link sheet-side sheet-done" data-act="close">Done</button></div>`;
  $('#sheetBody').innerHTML=`<div class="grab" aria-hidden="true"></div>${head}${body}`;

function closeSheet(){if(sheet.open) sheet.close();sheet.style.transform=''}
// Close only on a tap on the dimmed backdrop, i.e. outside the sheet's box. (A tap on the header can
// also be retargeted to the dialog itself, so e.target alone isn't enough.)
sheet.addEventListener('click',e=>{
  if(e.target!==sheet) return;
  const r=sheet.getBoundingClientRect();
  if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) return;
  closeSheet();
});
sheet.addEventListener('close',()=>{if(cur().v==='more') render(false)});
// Drag the grabber or header down: past 120px the sheet closes, otherwise it springs back.
(function(){
  let drag=null;
  sheet.addEventListener('pointerdown',e=>{
    if(!e.target.closest('.grab,.sheet-head')||e.target.closest('button,a,input,select,textarea')) return;
    drag={y:e.clientY,id:e.pointerId,moving:false};
  });
  sheet.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id) return;
    const dy=Math.max(0,e.clientY-drag.y);
    if(!drag.moving){if(dy<6) return;drag.moving=true;sheet.style.transition='none';try{sheet.setPointerCapture(e.pointerId)}catch(err){}} // a plain tap never captures
    sheet.style.transform=dy?`translateY(${dy}px)`:'';
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.id) return;
    const moving=drag.moving,dy=e.type==='pointercancel'?0:e.clientY-drag.y;drag=null;
    if(!moving) return;
    if(dy>120){sheet.style.transition='';closeSheet();return}
    const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    sheet.style.transition=reduce?'none':'transform .2s ease';sheet.style.transform='';
  };
  sheet.addEventListener('pointerup',end);sheet.addEventListener('pointercancel',end);
})();

function restoreFrom(text){
  text=String(text||'').trim();if(!text){toast('Paste a backup first');return}
  let d;try{d=parseBackup(text)}catch(e){toast('That doesn’t look like an ARK Studios backup');return}
  ui.pendingRestore=d;
  openSheet('Restore this backup?',`<p>It has ${d.clients.length} client${d.clients.length===1?'':'s'}${d.updatedAt?', last changed '+esc(fmtDate(isoOf(new Date(d.updatedAt)))):''}. Everything currently in the app will be replaced.</p><div class="btns fill"><button class="btn primary" data-act="doRestore">Restore backup</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
}
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f) return;const rd=new FileReader();rd.onload=()=>restoreFrom(rd.result);rd.readAsText(f);e.target.value=''});

    const sel=val('f_client'),btn=document.querySelector('[data-act=saveReh]');
    const c=getC(sel||(btn&&btn.dataset.c));if(!c) return;
    if(btn&&sel) btn.dataset.c=c.id;
    const r=(btn&&getR(c,btn.dataset.r))||{perfIds:[],attendance:{}};
    const tmp={...r,perfIds:t.id==='f_client'?[]:[...document.querySelectorAll('input[name=rp]:checked')].map(x=>x.value),attendance:{...r.attendance}};
    document.querySelectorAll('input[name=att]:checked').forEach(x=>tmp.attendance[x.value]=true);
    $('#rehPerfs').innerHTML=rehPerfsHTML(c,tmp);
    if($('#rehAttend')) $('#rehAttend').innerHTML=rehAttendHTML(c,tmp);
  }
  if(t.id==='f_client'&&document.querySelector('[data-act=savePay]')){const c=getC(t.value);const sm=$('#f_amt')&&$('#f_amt').nextElementSibling;if(c){const bal=totals(c).bal;$('#f_amt').placeholder=bal>0?bal:'';if(sm&&sm.tagName==='SMALL') sm.textContent=bal>0?'Balance is '+money(bal):''}}
});

ArkSwipe.attachSwipe(document.getElementById('app'),ArkNative.tap); // swipe actions buzz when they run
ArkNative.onBackButton(()=>{
  const a=ArkNative.backAction({sheetOpen:sheet.open,stackLen:ui.stack.length});
  if(a==='closeSheet') closeSheet(); else if(a==='back') back(); else ArkNative.exitApp();
});
// Android app only: at most once a day, offer a newer release (the web version updates itself).
async function maybeCheckUpdate(){
  if(!ArkNative.isNative()) return;
  const st=state.settings;
  const r=await ArkUpdate.checkForUpdate({now:Date.now(),lastCheckAt:st.lastUpdateCheckAt,current:APP_VERSION,dismissed:st.updateDismissedVersion,fetchFn:(u,o)=>fetch(u,o)});
  if(!r) return;
  st.lastUpdateCheckAt=r.checkedAt;quietSave();
  ui.update=r.banner;
  if(cur().v==='home') render(false);
}
ArkNative.onResume(maybeCheckUpdate);
applyTheme();
render(true);
maybeCheckUpdate();
// Web only: inside the APK the files ship with the app, and a worker could serve stale ones after an update.
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!ArkNative.isNative()){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
